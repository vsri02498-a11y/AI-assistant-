<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliotheca — Open Book Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d0d14;--bg2:#13131d;--bg3:#1a1a28;--bg4:#222235;
  --surface:#1e1e2e;--surface2:#252538;
  --border:#2d2d42;--border2:#3a3a52;
  --text:#f0ece2;--text2:#b8b0a0;--text3:#7a7268;
  --gold:#d4a853;--gold2:#e8c07a;--gold3:#a07830;
  --red:#c0392b;--green:#27ae60;--blue:#2980b9;
  --shadow:0 4px 24px rgba(0,0,0,.45);--shadow2:0 8px 48px rgba(0,0,0,.65);
  --r:8px;--r2:12px;--tr:.2s ease;
}
[data-theme="light"]{
  --bg:#faf8f4;--bg2:#f0ece4;--bg3:#e8e4dc;--bg4:#ddd8ce;
  --surface:#ffffff;--surface2:#f5f2ec;
  --border:#ddd8ce;--border2:#ccc7bc;
  --text:#1a1714;--text2:#5a5248;--text3:#8a8278;
  --gold:#a07830;--gold2:#c09040;--gold3:#806020;
  --shadow:0 4px 24px rgba(0,0,0,.1);--shadow2:0 8px 48px rgba(0,0,0,.18);
}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:'Crimson Text',Georgia,serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--gold3)}
h1,h2,h3,h4,h5{font-family:'Playfair Display',Georgia,serif;line-height:1.2}
a{color:inherit;text-decoration:none}

/* LAYOUT */
.app{display:flex;min-height:100vh}
.sidebar{width:240px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s ease}
.main{flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh}

/* SIDEBAR */
.s-logo{padding:22px 20px 18px;border-bottom:1px solid var(--border)}
.logo-mark{font-family:'Playfair Display',serif;font-size:22px;font-weight:900;font-style:italic;color:var(--gold);letter-spacing:-.5px}
.logo-sub{font-family:'DM Sans',sans-serif;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:2px;margin-top:2px}
.s-nav{flex:1;padding:14px 0;overflow-y:auto}
.s-section{font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:12px 20px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13.5px;border-left:3px solid transparent;transition:all var(--tr)}
.nav-item:hover{background:var(--bg3);color:var(--text)}
.nav-item.active{background:var(--bg3);color:var(--gold);border-left-color:var(--gold);font-weight:500}
.nav-item .ni{width:18px;text-align:center;font-size:15px}
.nav-badge{margin-left:auto;background:var(--gold3);color:var(--bg);font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;font-family:'DM Sans',sans-serif}
.s-foot{padding:14px 18px;border-top:1px solid var(--border)}
.theme-btn{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text2);width:100%;transition:all var(--tr)}
.theme-btn:hover{background:var(--bg4);color:var(--gold)}

/* TOPBAR */
.topbar{position:sticky;top:0;z-index:99;background:var(--bg2);border-bottom:1px solid var(--border);padding:0 28px;height:58px;display:flex;align-items:center;gap:16px}
.mob-menu{display:none;background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:7px 10px;border-radius:6px;cursor:pointer;font-size:17px}
.search-wrap{flex:1;max-width:500px;position:relative}
.search-in{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:22px;padding:8px 38px 8px 38px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px;outline:none;transition:all var(--tr)}
.search-in:focus{border-color:var(--gold3);background:var(--surface);box-shadow:0 0 0 3px rgba(212,168,83,.1)}
.s-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.s-clear{position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--text3);cursor:pointer;background:none;border:none;font-size:14px;padding:3px;display:none}
.search-in:not(:placeholder-shown)~.s-clear{display:block}
.tb-actions{display:flex;align-items:center;gap:10px;margin-left:auto}
.tb-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:7px 13px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12.5px;display:flex;align-items:center;gap:5px;transition:all var(--tr);white-space:nowrap}
.tb-btn:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}

/* SEARCH DROPDOWN */
.srch-drop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--border2);border-radius:var(--r);box-shadow:var(--shadow2);z-index:300;max-height:360px;overflow-y:auto;display:none}
.srch-drop.open{display:block}
.sr-item{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background var(--tr)}
.sr-item:last-child{border-bottom:none}
.sr-item:hover{background:var(--bg3)}
.sr-cov{width:28px;height:42px;border-radius:3px;flex-shrink:0;overflow:hidden;position:relative}
.sr-info{flex:1;min-width:0}
.sr-title{font-family:'Crimson Text',serif;font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-auth{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3)}
.sr-none{padding:20px 16px;text-align:center;font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text3)}

/* VIEWS */
.view{flex:1;padding:28px 32px;display:none}
.view.active{display:block;animation:fadeUp .25s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HOME */
.hero{background:linear-gradient(135deg,var(--bg3) 0%,var(--surface2) 100%);border:1px solid var(--border);border-radius:var(--r2);padding:44px 48px;margin-bottom:36px;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-40%;right:-5%;width:380px;height:380px;background:radial-gradient(circle,rgba(212,168,83,.07) 0%,transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:'"';position:absolute;right:40px;top:10px;font-family:'Playfair Display',serif;font-size:220px;font-weight:900;color:rgba(212,168,83,.05);line-height:1;pointer-events:none;user-select:none}
.hero-eye{font-family:'DM Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--gold);margin-bottom:10px}
.hero-h{font-size:40px;font-weight:900;color:var(--text);margin-bottom:14px;line-height:1.1}
.hero-p{font-size:17px;color:var(--text2);max-width:480px;line-height:1.65;margin-bottom:24px}
.hero-stats{display:flex;gap:32px;flex-wrap:wrap}
.hs-num{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--gold)}
.hs-lab{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.sec-title{font-size:22px;font-weight:700;color:var(--text)}
.sec-link{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--gold);cursor:pointer;border-bottom:1px solid transparent;transition:border-color var(--tr)}
.sec-link:hover{border-bottom-color:var(--gold)}
.featured-strip{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none;margin-bottom:36px}
.featured-strip::-webkit-scrollbar{display:none}
.feat-card{flex-shrink:0;width:260px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;cursor:pointer;transition:all var(--tr)}
.feat-card:hover{transform:translateY(-4px);box-shadow:var(--shadow2);border-color:var(--border2)}
.feat-cov{height:130px;position:relative;overflow:hidden}
.feat-badge{position:absolute;top:10px;left:10px;background:var(--gold);color:var(--bg);font-family:'DM Sans',sans-serif;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border-radius:10px;z-index:1}
.feat-info{padding:14px}
.feat-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px;line-height:1.3}
.feat-auth{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3);margin-bottom:8px}

/* BOOK COVERS */
.cover{width:100%;height:100%;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:10px}
.cover-txt{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;color:rgba(255,255,255,.92);line-height:1.3;text-shadow:0 1px 6px rgba(0,0,0,.6);position:relative;z-index:2;word-break:break-word;hyphens:auto}
.cover-over{position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.55) 100%);z-index:1}
.cover-deco{position:absolute;inset:0;opacity:.18;z-index:0}

/* GRID */
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:18px;margin-bottom:32px}
.book-card{cursor:pointer;transition:transform var(--tr),box-shadow var(--tr);border-radius:var(--r);overflow:hidden}
.book-card:hover{transform:translateY(-4px);box-shadow:var(--shadow2)}
.bc-img{width:100%;aspect-ratio:2/3;border-radius:var(--r) var(--r) 0 0;overflow:hidden;position:relative}
.bc-info{background:var(--surface);padding:10px 11px 12px;border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r)}
.bc-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-auth{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3);margin-bottom:7px}
.stars{display:flex;gap:1px}
.star{font-size:10.5px;color:var(--gold)}
.star.e{color:var(--border2)}
.rnum{font-family:'DM Sans',sans-serif;font-size:10.5px;color:var(--text3);margin-left:3px}

/* LIST VIEW */
.books-list{display:flex;flex-direction:column;gap:10px}
.bl-item{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all var(--tr)}
.bl-item:hover{border-color:var(--border2);background:var(--surface2);transform:translateX(3px)}
.bl-cov{width:56px;height:84px;border-radius:4px;flex-shrink:0;overflow:hidden;position:relative}
.bl-info{flex:1;min-width:0}
.bl-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px}
.bl-auth{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);margin-bottom:7px}
.bl-desc{font-size:14px;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.bl-meta{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap}
.tag{background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;padding:2px 8px;border-radius:12px}
.bl-actions{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:space-between;flex-shrink:0}

/* TABLE VIEW */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r)}
.bk-table{width:100%;border-collapse:collapse;font-family:'DM Sans',sans-serif;font-size:13px}
.bk-table th{background:var(--bg3);color:var(--text3);font-size:10px;text-transform:uppercase;letter-spacing:1px;font-weight:500;padding:10px 14px;text-align:left;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;user-select:none}
.bk-table th:hover,.bk-table th.sorted{color:var(--gold)}
.bk-table td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2);vertical-align:middle}
.bk-table tr:last-child td{border-bottom:none}
.bk-table tr:hover td{background:var(--bg3);cursor:pointer}
.tbl-title{color:var(--text);font-weight:500;font-family:'Crimson Text',serif;font-size:14.5px}
.tbl-mini{width:28px;height:42px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:9px;overflow:hidden;position:relative}

/* LIBRARY TOOLBAR */
.lib-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden}
.vbtn{background:var(--bg3);border:none;color:var(--text3);padding:7px 11px;cursor:pointer;font-size:13.5px;transition:all var(--tr);border-right:1px solid var(--border)}
.vbtn:last-child{border-right:none}
.vbtn:hover,.vbtn.active{background:var(--surface2);color:var(--gold)}
.f-sel{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:7px 11px;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;cursor:pointer}
.f-sel:focus{border-color:var(--gold3)}
.res-count{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text3);margin-left:auto}

/* BOOK DETAIL */
.detail-back{display:flex;align-items:center;gap:7px;color:var(--text3);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;margin-bottom:22px;width:fit-content;padding:6px 12px;border-radius:6px;transition:all var(--tr);background:var(--bg3);border:1px solid var(--border)}
.detail-back:hover{color:var(--text);background:var(--bg4)}
.detail-layout{display:grid;grid-template-columns:210px 1fr 270px;gap:28px;align-items:start}
.det-cov{width:100%;aspect-ratio:2/3;border-radius:var(--r);overflow:hidden;position:relative;box-shadow:var(--shadow2);margin-bottom:14px}
.det-actions{display:flex;flex-direction:column;gap:7px}
.btn{padding:9px 18px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;border:1px solid transparent;transition:all var(--tr);display:flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.btn-primary:hover{background:var(--gold2);border-color:var(--gold2)}
.btn-sec{background:var(--bg3);color:var(--text2);border-color:var(--border)}
.btn-sec:hover{background:var(--bg4);color:var(--text);border-color:var(--border2)}
.btn-shelf{background:var(--surface2);color:var(--text2);border-color:var(--border);font-size:12px;padding:7px 11px}
.btn-shelf:hover,.btn-shelf.on{color:var(--gold);border-color:var(--gold3);background:rgba(212,168,83,.08)}
.det-eye{font-family:'DM Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--gold);margin-bottom:7px}
.det-title{font-size:34px;font-weight:900;color:var(--text);margin-bottom:5px;line-height:1.15}
.det-auth{font-size:18px;font-style:italic;color:var(--text2);margin-bottom:18px}
.det-rate-row{display:flex;align-items:center;gap:14px;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--border)}
.det-rate-big{font-family:'Playfair Display',serif;font-size:38px;font-weight:700;color:var(--gold);line-height:1}
.det-stars{font-size:17px;margin-bottom:3px}
.det-rcnt{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3)}
.det-desc{font-size:16px;line-height:1.85;color:var(--text2);margin-bottom:24px}
.det-desc p{margin-bottom:13px}
.quote-blk{border-left:3px solid var(--gold3);padding:14px 18px;margin:20px 0;background:var(--bg3);border-radius:0 var(--r) var(--r) 0}
.quote-t{font-size:16px;font-style:italic;color:var(--text2);line-height:1.7;margin-bottom:6px}
.quote-a{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3)}
.det-sec{font-family:'Playfair Display',serif;font-size:21px;font-weight:700;color:var(--text);margin-bottom:14px;margin-top:28px;padding-bottom:9px;border-bottom:1px solid var(--border)}
.toc-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:22px}
.toc-hdr{font-family:'DM Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:10px}
.toc-row{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text2);padding:5px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.toc-row:last-child{border-bottom:none}
.toc-row span{color:var(--text3)}
.review-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:13px}
.rev-hdr{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rev-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;color:#fff;flex-shrink:0}
.rev-name{font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;color:var(--text)}
.rev-date{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3)}
.rev-txt{font-size:15px;line-height:1.7;color:var(--text2)}
.rev-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:18px}
.rev-ta,.notes-ta{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:6px;font-family:'Crimson Text',serif;font-size:15px;min-height:80px;resize:vertical;outline:none;line-height:1.6;margin-top:7px}
.rev-ta:focus,.notes-ta:focus{border-color:var(--gold3)}
.meta-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px}
.mc-title{font-family:'DM Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:14px}
.m-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-family:'DM Sans',sans-serif;font-size:13px}
.m-row:last-child{border-bottom:none}
.m-lab{color:var(--text3)}
.m-val{color:var(--text);font-weight:500;text-align:right}
.prog-wrap{background:var(--bg3);border-radius:4px;height:6px;margin-top:7px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:4px;transition:width .5s ease}
.prog-row{display:flex;align-items:center;gap:7px;margin-top:7px}
.prog-in{width:65px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:5px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none}
.prog-in:focus{border-color:var(--gold3)}
.rel-book{display:flex;gap:10px;align-items:center;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--border);transition:opacity var(--tr)}
.rel-book:last-child{border-bottom:none}
.rel-book:hover{opacity:.8}
.rel-cov{width:36px;height:54px;border-radius:3px;overflow:hidden;position:relative;flex-shrink:0}
.rel-info{flex:1;min-width:0}
.rel-title{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--text);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rel-auth{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3);margin-top:2px}

/* SHELF */
.shelf-tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:22px;gap:0}
.stab{font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:500;padding:11px 18px;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all var(--tr);position:relative;bottom:-1px}
.stab:hover{color:var(--text)}
.stab.active{color:var(--gold);border-bottom-color:var(--gold)}
.stab-cnt{display:inline-flex;align-items:center;justify-content:center;background:var(--bg3);border-radius:10px;font-size:10px;padding:1px 5px;margin-left:5px;color:var(--text3)}
.stab.active .stab-cnt{background:rgba(212,168,83,.15);color:var(--gold)}
.shelf-card{display:flex;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer;transition:all var(--tr);margin-bottom:10px}
.shelf-card:hover{border-color:var(--border2);background:var(--surface2)}
.sc-cov{width:56px;height:84px;border-radius:4px;flex-shrink:0;overflow:hidden;position:relative}
.sc-info{flex:1;min-width:0}
.sc-title{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--text);margin-bottom:3px}
.sc-auth{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);margin-bottom:8px}
.sc-actions{display:flex;gap:6px;flex-shrink:0;align-items:flex-start}

/* CATEGORIES */
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:32px}
.cat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;cursor:pointer;transition:all var(--tr);position:relative;overflow:hidden}
.cat-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.cat-icon{font-size:30px;margin-bottom:10px;display:block}
.cat-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:3px}
.cat-cnt{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3)}
.cat-bg{position:absolute;bottom:-16px;right:-16px;font-size:72px;opacity:.04;pointer-events:none;user-select:none}

/* AUTHORS */
.auth-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;cursor:pointer;transition:all var(--tr);text-align:center}
.auth-card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:var(--shadow)}
.auth-av{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;margin:0 auto 11px}
.auth-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text);margin-bottom:3px}
.auth-cnt{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);margin-bottom:9px}
.tag-list{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.atag{background:var(--bg3);border:1px solid var(--border);color:var(--text3);font-family:'DM Sans',sans-serif;font-size:11px;padding:2px 8px;border-radius:12px;cursor:pointer;transition:all var(--tr)}
.atag:hover{background:rgba(212,168,83,.1);border-color:var(--gold3);color:var(--gold)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:28px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px}
.stat-lab{font-family:'DM Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:7px}
.stat-val{font-family:'Playfair Display',serif;font-size:34px;font-weight:700;color:var(--gold);line-height:1;margin-bottom:3px}
.stat-sub{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3)}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;margin-bottom:18px}
.ch-title{font-family:'DM Sans',sans-serif;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);margin-bottom:16px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar-lab{font-family:'DM Sans',sans-serif;font-size:12.5px;color:var(--text2);width:150px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{flex:1;background:var(--bg3);border-radius:3px;height:7px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold));border-radius:3px;transition:width .8s ease}
.bar-cnt{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);width:28px;text-align:right;flex-shrink:0}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:20px}
.ach-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;text-align:center;opacity:.5;transition:all var(--tr)}
.ach-card.earned{opacity:1;border-color:var(--gold3)}
.ach-icon{font-size:28px;margin-bottom:8px}
.ach-name{font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text);margin-bottom:3px}
.ach-desc{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--text3)}

/* EMPTY STATE */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}
.empty-icon{font-size:44px;margin-bottom:14px}
.empty-title{font-family:'Playfair Display',serif;font-size:22px;color:var(--text2);margin-bottom:7px}
.empty-sub{font-family:'DM Sans',sans-serif;font-size:14px}

/* PAGINATION */
.pag{display:flex;justify-content:center;gap:5px;margin-top:28px}
.pg-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);width:34px;height:34px;border-radius:6px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all var(--tr)}
.pg-btn:hover{background:var(--bg4);color:var(--text)}
.pg-btn.active{background:var(--gold);color:var(--bg);border-color:var(--gold)}
.pg-btn:disabled{opacity:.35;cursor:not-allowed}

/* TOAST */
.toasts{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:11px 18px;font-family:'DM Sans',sans-serif;font-size:13.5px;color:var(--text);box-shadow:var(--shadow2);display:flex;align-items:center;gap:9px;animation:tin .3s ease;max-width:300px}
.toast.ok{border-left:3px solid var(--green)}
.toast.err{border-left:3px solid var(--red)}
.toast.info{border-left:3px solid var(--gold)}
@keyframes tin{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* USER RATING */
.my-rate-stars{display:flex;gap:4px;cursor:pointer;margin-top:8px}
.my-star{font-size:20px;color:var(--border2);transition:color var(--tr)}
.my-star:hover,.my-star.on{color:var(--gold)}

/* MOBILE */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99}
.sb-overlay.open{display:block}
@media(max-width:1050px){
  .detail-layout{grid-template-columns:200px 1fr}
  .det-sidebar-col{display:none}
}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar,.view{padding-left:16px;padding-right:16px}
  .view{padding-top:20px;padding-bottom:20px}
  .hero{padding:26px 22px}
  .hero-h{font-size:26px}
  .hero-stats{gap:18px}
  .hs-num{font-size:22px}
  .detail-layout{grid-template-columns:1fr}
  .det-cov-col{display:flex;gap:14px;align-items:flex-start}
  .det-cov{width:110px;flex-shrink:0;margin-bottom:0}
  .det-actions{flex-direction:row;flex-wrap:wrap}
  .books-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .mob-menu{display:flex!important}
}

/* FOOTER */
.app-foot{background:var(--bg2);border-top:1px solid var(--border);padding:18px 32px;font-family:'DM Sans',sans-serif;font-size:12px;color:var(--text3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:7px}
.foot-links{display:flex;gap:14px}
.foot-link{cursor:pointer;transition:color var(--tr)}
.foot-link:hover{color:var(--gold)}
</style>
</head>

<script>

const BOOKS=[
{id:1,title:"To Kill a Mockingbird",author:"Harper Lee",genre:"Classic Fiction",year:1960,pages:336,rating:4.8,reviews:2847,description:"A powerful story of racial injustice and moral growth in the American South. Young Scout Finch watches as her father Atticus Finch, a principled lawyer, defends Tom Robinson—a Black man wrongly accused—against the prejudices of their town.\n\nThe novel is a masterpiece of moral courage, compassion, and the loss of innocence.",quote:"You never really understand a person until you consider things from his point of view.",tags:["Justice","Race","Coming-of-Age"],c:["#1a3a5c","#2d6a9f"],featured:true,chapters:["Scout's Early Years","The Trial","Aftermath"]},
{id:2,title:"1984",author:"George Orwell",genre:"Dystopian Fiction",year:1949,pages:328,rating:4.7,reviews:3241,description:"A chilling portrait of a totalitarian future where Big Brother watches every move. Winston Smith secretly rebels against the oppressive Party, its doublethink, and its manipulation of truth and history.\n\nOrwell's masterwork remains the definitive warning against totalitarianism and the erosion of individual freedom.",quote:"War is peace. Freedom is slavery. Ignorance is strength.",tags:["Dystopia","Surveillance","Politics"],c:["#1c1c1c","#3a3a3a"],featured:true,chapters:["Part One","Part Two","Part Three"]},
{id:3,title:"Pride and Prejudice",author:"Jane Austen",genre:"Classic Romance",year:1813,pages:432,rating:4.6,reviews:2198,description:"A witty and romantic novel following Elizabeth Bennet as she navigates questions of manners, morality, and marriage in early 19th-century England—and her complex relationship with the proud Mr. Darcy.\n\nAusten's masterful comedy of manners remains endlessly fresh and insightful about human nature.",quote:"It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.",tags:["Romance","Comedy of Manners","Victorian"],c:["#7b3f6e","#c27ba0"],featured:true,chapters:["Volume I","Volume II","Volume III"]},
{id:4,title:"The Great Gatsby",author:"F. Scott Fitzgerald",genre:"Classic Fiction",year:1925,pages:180,rating:4.3,reviews:1876,description:"Set in the roaring 1920s, Nick Carraway narrates the obsessive pursuit of the enigmatic Jay Gatsby, whose lavish parties conceal a yearning for his lost love Daisy Buchanan.\n\nA masterful critique of the American Dream and the hollow glamour of the Jazz Age.",quote:"So we beat on, boats against the current, borne back ceaselessly into the past.",tags:["American Dream","1920s","Wealth"],c:["#1a4a2e","#2e7d52"],chapters:["Chapters 1–4","Chapters 5–7","Chapters 8–9"]},
{id:5,title:"Dune",author:"Frank Herbert",genre:"Science Fiction",year:1965,pages:688,rating:4.7,reviews:2934,description:"An epic set on the desert planet Arrakis, where young Paul Atreides navigates political intrigue, ecological mastery, and the messianic power that comes with controlling the universe's most precious substance: spice.\n\nHerbert's worldbuilding remains unmatched in scope and complexity.",quote:"I must not fear. Fear is the mind-killer.",tags:["Space","Politics","Ecology"],c:["#7d4e00","#c4860a"],featured:true,chapters:["Book I: Dune","Book II: Muad'Dib","Book III: The Prophet"]},
{id:6,title:"Crime and Punishment",author:"Fyodor Dostoevsky",genre:"Psychological Fiction",year:1866,pages:551,rating:4.6,reviews:1654,description:"A tormented student in St. Petersburg murders a pawnbroker, believing himself above ordinary morality. Raskolnikov's psychological unraveling and quest for redemption form one of literature's most gripping examinations of guilt and conscience.",quote:"Pain and suffering are always inevitable for a large intelligence and a deep heart.",tags:["Psychology","Guilt","Redemption"],c:["#3d1a0d","#6b3420"],chapters:["Part I","Part II–III","Part IV–VI","Epilogue"]},
{id:7,title:"The Hitchhiker's Guide to the Galaxy",author:"Douglas Adams",genre:"Comic Science Fiction",year:1979,pages:224,rating:4.5,reviews:2156,description:"Moments before Earth is demolished to make way for a hyperspace bypass, Arthur Dent is whisked off by alien friend Ford Prefect on a wildly improbable adventure across the universe.\n\nAdams' comedic masterpiece combines absurdist humor with genuine philosophical insight.",quote:"The answer to the ultimate question of life, the universe, and everything is 42.",tags:["Humor","Space","Philosophy"],c:["#004d99","#0066cc"],chapters:["Earth Destroyed","Deep Thought","Magrathea"]},
{id:8,title:"One Hundred Years of Solitude",author:"Gabriel García Márquez",genre:"Magical Realism",year:1967,pages:417,rating:4.5,reviews:1432,description:"The multigenerational saga of the Buendía family in the fictional town of Macondo, blending the mundane and the miraculous in a lyrical exploration of history, memory, and human destiny.\n\nGarcía Márquez's masterpiece launched magical realism into the global literary canon.",quote:"There is always something left to love.",tags:["Magic Realism","Family","Latin America"],c:["#2d6a4f","#52b788"],chapters:["The Founding","Rise & Fall","Apocalypse"]},
{id:9,title:"Brave New World",author:"Aldous Huxley",genre:"Dystopian Fiction",year:1932,pages:311,rating:4.4,reviews:1789,description:"In a future society where stability is maintained through genetic engineering and conditioning, Bernard Marx questions the cost of perfect happiness. Huxley's vision foresaw our age of entertainment and pharmaceutical control with eerie prescience.",quote:"Actual happiness always looks pretty squalid in comparison with the over-compensations for misery.",tags:["Dystopia","Technology","Society"],c:["#1a1a4e","#2b2b7a"],chapters:["London 2540","The Savage Reservation","The Conflict"]},
{id:10,title:"The Lord of the Rings",author:"J.R.R. Tolkien",genre:"Fantasy",year:1954,pages:1178,rating:4.9,reviews:4521,description:"The definitive high fantasy epic following Frodo Baggins and the Fellowship on a quest to destroy the One Ring and defeat the dark lord Sauron—a monumental work of world-building and heroic mythology.\n\nTolkien created not merely a story but an entire world complete with languages, histories, and cosmologies.",quote:"Not all those who wander are lost.",tags:["Epic Fantasy","Quest","Mythology"],c:["#2e4a1e","#4a7a32"],featured:true,chapters:["The Fellowship of the Ring","The Two Towers","The Return of the King"]},
{id:11,title:"Sapiens: A Brief History of Humankind",author:"Yuval Noah Harari",genre:"Non-Fiction",year:2011,pages:443,rating:4.6,reviews:3102,description:"A sweeping narrative of human history from the Stone Age to the present, examining how Homo sapiens came to dominate the earth through cognitive, agricultural, and scientific revolutions.\n\nHarari challenges us to question our assumptions about progress, happiness, and the future.",quote:"History is something that very few people have been doing while everyone else was plowing fields.",tags:["History","Anthropology","Evolution"],c:["#3d2b1f","#6b4c35"],featured:true,chapters:["Cognitive Revolution","Agricultural Revolution","Unification of Humankind","Scientific Revolution"]},
{id:12,title:"Harry Potter and the Philosopher's Stone",author:"J.K. Rowling",genre:"Fantasy",year:1997,pages:223,rating:4.8,reviews:5234,description:"Orphaned Harry Potter discovers on his eleventh birthday that he is a wizard, and begins his extraordinary education at Hogwarts School of Witchcraft and Wizardry, uncovering his true destiny.\n\nRowling crafted a story that resonated across generations, blending warmth, wonder, and genuine moral depth.",quote:"It does not do to dwell on dreams and forget to live.",tags:["Magic","Coming-of-Age","Adventure"],c:["#740001","#ae0001"],chapters:["The Boy Who Lived","Hogwarts","The Philosopher's Stone"]},
{id:13,title:"The Alchemist",author:"Paulo Coelho",genre:"Philosophical Fiction",year:1988,pages:208,rating:4.4,reviews:2567,description:"A young Andalusian shepherd follows his dream across the desert to Egypt, guided by omens and the wisdom of the universe. A beloved parable about following one's personal legend and listening to the heart's deepest desires.",quote:"And, when you want something, all the universe conspires in helping you to achieve it.",tags:["Philosophy","Journey","Self-Discovery"],c:["#7d5a00","#b8860b"],chapters:["The Crystal Merchant","The Desert","The Pyramids"]},
{id:14,title:"Meditations",author:"Marcus Aurelius",genre:"Philosophy",year:180,pages:254,rating:4.7,reviews:1876,description:"Personal reflections of a Roman Emperor, offering profound insights on Stoic philosophy—duty, resilience, impermanence, and the pursuit of virtue in the face of mortality and uncertainty.\n\nWritten as private notes never meant for publication, these are among the most honest and practical philosophical writings ever preserved.",quote:"The impediment to action advances action. What stands in the way becomes the way.",tags:["Stoicism","Philosophy","Self-Improvement"],c:["#4a4a4a","#6b6b6b"],chapters:["Books I–IV","Books V–VIII","Books IX–XII"]},
{id:15,title:"Atomic Habits",author:"James Clear",genre:"Self-Help",year:2018,pages:320,rating:4.7,reviews:4123,description:"A comprehensive guide to building good habits and breaking bad ones, drawing on proven strategies from psychology and neuroscience to show how tiny changes can create remarkable results.\n\nClear's accessible framework has helped millions readers transform their lives one percent at a time.",quote:"Every action you take is a vote for the type of person you wish to become.",tags:["Habits","Productivity","Psychology"],c:["#cc3300","#ff4400"],featured:true,chapters:["The Fundamentals","The 1st Law","The 2nd Law","The 3rd Law","The 4th Law"]},
{id:16,title:"The Road",author:"Cormac McCarthy",genre:"Literary Fiction",year:2006,pages:287,rating:4.5,reviews:1432,description:"A harrowing journey of a father and son through a post-apocalyptic American landscape, pushing the limits of love and survival in a world reduced to ash and silence.\n\nMcCarthy's stripped, relentless prose creates an unforgettable meditation on parental love and endurance.",quote:"You have to carry the fire.",tags:["Post-Apocalyptic","Survival","Parenthood"],c:["#2a2a2a","#4d4d4d"],chapters:["The Journey Begins","Crossing the Mountains","The Coast"]},
{id:17,title:"Thinking, Fast and Slow",author:"Daniel Kahneman",genre:"Psychology",year:2011,pages:499,rating:4.6,reviews:2234,description:"Nobel laureate Daniel Kahneman explores the dual systems that drive the way we think—the fast, intuitive System 1 and the slower, deliberate System 2—illuminating the cognitive biases that shape our decisions.\n\nAn essential guide to understanding the hidden mechanics of human judgment.",quote:"Nothing in life is as important as you think it is, while you are thinking about it.",tags:["Psychology","Decision-Making","Behavioral Economics"],c:["#1a3a5c","#245e8a"],chapters:["Two Systems","Heuristics & Biases","Overconfidence","Choices"]},
{id:18,title:"Norwegian Wood",author:"Haruki Murakami",genre:"Literary Fiction",year:1987,pages:296,rating:4.4,reviews:1876,description:"A nostalgic and melancholy tale set in late 1960s Tokyo, where student Toru Watanabe reflects on his passionate youth and his relationships with two very different women amid student unrest.\n\nMurakami's most directly realist novel is a deeply moving meditation on loss, grief, and the transition to adulthood.",quote:"If you only read the books that everyone else is reading, you can only think what everyone else is thinking.",tags:["Loss","Love","Coming-of-Age"],c:["#1a4a2e","#2e7d52"],chapters:["1969","The Sanatorium","Midori","Resolution"]},
{id:19,title:"Foundation",author:"Isaac Asimov",genre:"Science Fiction",year:1951,pages:255,rating:4.6,reviews:1654,description:"Hari Seldon develops psychohistory, a science that predicts the future of civilization, and creates the Foundation—a carefully placed group meant to shorten the coming Dark Age from 30,000 years to just 1,000.\n\nAsimov's magnum opus is a breathtaking exploration of mathematics, history, and the shaping of civilization.",quote:"The fall of Empire is a massive thing, but it is not easily perceived.",tags:["Space","Civilization","Mathematics"],c:["#003366","#004499"],chapters:["The Psychohistorians","The Encyclopedists","The Traders","The General"]},
{id:20,title:"The Brothers Karamazov",author:"Fyodor Dostoevsky",genre:"Philosophical Fiction",year:1880,pages:796,rating:4.7,reviews:1234,description:"Dostoevsky's final masterwork—a passionate philosophical novel that enters the spiritual and moral battle between three brothers against a backdrop of parricide and the existence of God.\n\nWidely regarded as one of the greatest novels ever written, it encompasses crime, faith, doubt, and the deepest questions of the human soul.",quote:"The mystery of human existence lies not in just staying alive, but in finding something to live for.",tags:["Philosophy","Family","Religion"],c:["#3d1a4a","#6b2d8a"],chapters:["The Brothers Meet","The Grand Inquisitor","The Trial","Epilogue"]},
{id:21,title:"The Name of the Wind",author:"Patrick Rothfuss",genre:"Fantasy",year:2007,pages:662,rating:4.6,reviews:2134,description:"The first day in the tale of Kvothe—one of the most legendary figures in his world's history—as told by himself: a story of love and loss, birth and beginnings, and the innate human need for meaning.\n\nRothfuss brings extraordinary prose artistry to the epic fantasy genre.",quote:"It's like everyone tells a story about themselves inside their own head.",tags:["Magic","Coming-of-Age","Epic Fantasy"],c:["#1a2a4a","#2d4a7a"],chapters:["The Name of the Wind","The University","Trebon","Intermission"]},
{id:22,title:"A Brief History of Time",author:"Stephen Hawking",genre:"Science",year:1988,pages:212,rating:4.5,reviews:1876,description:"Stephen Hawking's landmark exploration of black holes, the Big Bang, and the nature of time—making complex cosmological concepts accessible to general readers and asking the ultimate questions about the universe.\n\nOne of the best-selling popular science books ever written.",quote:"My goal is simple. It is a complete understanding of the universe.",tags:["Cosmology","Physics","Space"],c:["#000033","#000066"],chapters:["Our Picture of the Universe","Space and Time","Black Holes","The Origin and Fate of the Universe"]},
{id:23,title:"Don Quixote",author:"Miguel de Cervantes",genre:"Classic Fiction",year:1605,pages:863,rating:4.4,reviews:987,description:"The misadventures of the self-styled knight-errant Don Quixote and his loyal squire Sancho Panza as they tilt at windmills and right imaginary wrongs across Spain.\n\nConsidered the first modern novel, Cervantes' masterpiece transcends comedy to become a profound meditation on idealism, reality, and the power of imagination.",quote:"When life itself seems lunatic, who knows where madness lies?",tags:["Adventure","Satire","Classic"],c:["#5a3010","#8b4a18"],chapters:["Part One","Part Two"]},

{id:27,title:"The Shadow of the Wind",author:"Carlos Ruiz Zafón",genre:"Mystery Fiction",year:2001,pages:487,rating:4.7,reviews:1876,description:"In post-war Barcelona, young Daniel discovers a mysterious novel and becomes obsessed with finding its author—only to learn someone is destroying every copy of every book the author ever wrote.\n\nA gorgeous literary mystery and love letter to books themselves.",quote:"Every book has a soul. The soul of the person who wrote it and of those who read it.",tags:["Mystery","Books","Barcelona"],c:["#1a0d33","#2d1a57"],chapters:["The Cemetery of Forgotten Books","The Mystery Deepens","Revelations"]},
{id:28,title:"The Night Circus",author:"Erin Morgenstern",genre:"Fantasy",year:2011,pages:387,rating:4.5,reviews:2341,description:"A mysterious black-and-white circus appears overnight, lasting only until dawn. Inside, two magicians raised as rivals fall in love as their magical contest threatens everyone they care about.\n\nMorgenstern's debut is a lush, atmospheric marvel of imaginative fiction.",quote:"The circus arrives without warning. No announcements precede it. It is simply there, when yesterday it was not.",tags:["Magic","Love","Mystery"],c:["#1a1a1a","#333333"],chapters:["Anticipation","Illumination","Intersections","Fearsome Wonders"]},
{id:29,title:"The Art of War",author:"Sun Tzu",genre:"Philosophy",year:-500,pages:68,rating:4.5,reviews:2109,description:"The ancient Chinese military treatise comprising 13 chapters on warfare strategy. Its wisdom extends far beyond the battlefield—applied today in business, sports, diplomacy, and everyday decision-making.\n\nFew texts have influenced so many fields across so many centuries.",quote:"Supreme excellence consists in breaking the enemy's resistance without fighting.",tags:["Strategy","Military","Philosophy"],c:["#4a2000","#7a3300"],chapters:["Laying Plans","Waging War","Attack by Stratagem","Tactical Positions","Use of Energy","Weak Points","Maneuvering","Variation of Tactics"]},
{id:30,title:"War and Peace",author:"Leo Tolstoy",genre:"Historical Fiction",year:1869,pages:1225,rating:4.6,reviews:1098,description:"Tolstoy's monumental panorama of Russian life during the Napoleonic Wars, following five aristocratic families through the tumult of war, romance, and philosophical reflection.\n\nA supreme achievement in world literature—as much a philosophical treatise as a novel.",quote:"All great literature is one of two stories; a man goes on a journey or a stranger comes to town.",tags:["Russia","War","History"],c:["#1a2a4a","#2d4a7a"],chapters:["Books 1–5","Books 6–10","Books 11–15","Epilogue"]},
{id:31,title:"Hamlet",author:"William Shakespeare",genre:"Drama",year:1603,pages:342,rating:4.8,reviews:3456,description:"Prince Hamlet is called to avenge his father's murder by his treacherous uncle Claudius, who has married Hamlet's mother and seized the throne of Denmark. Shakespeare's most celebrated tragedy plumbs the depths of grief, revenge, action, and paralysed indecision.",quote:"To be, or not to be, that is the question.",tags:["Tragedy","Revenge","Drama"],c:["#2a2a4a","#3d3d6b"],chapters:["Act I","Act II","Act III","Act IV","Act V"]},
{id:32,title:"Anna Karenina",author:"Leo Tolstoy",genre:"Classic Fiction",year:1877,pages:864,rating:4.7,reviews:1543,description:"An aristocratic Russian woman abandons her husband and son for the dashing military officer Vronsky—with tragic consequences. A masterful exploration of society, morality, and the human capacity for self-destruction.\n\nTolstoy's greatest novel remains the gold standard for psychological realism.",quote:"Happy families are all alike; every unhappy family is unhappy in its own way.",tags:["Romance","Society","Russia"],c:["#7a1a2d","#b02d44"],chapters:["Part One–Two","Part Three–Four","Part Five–Six","Part Seven–Eight"]},
{id:33,title:"Midnight's Children",author:"Salman Rushdie",genre:"Magical Realism",year:1981,pages:533,rating:4.4,reviews:1098,description:"Born at the exact moment of India's independence, Saleem Sinai discovers he is telepathically connected to other midnight-born children. A kaleidoscopic novel of personal and national history.\n\nRushdie's Booker Prize-winning masterpiece reinvented Indian English literature.",quote:"To understand me, you'll have to swallow a world.",tags:["India","Magic Realism","History"],c:["#7a4a00","#b87000"],chapters:["Part One","Part Two","Part Three"]},
{id:34,title:"The Catcher in the Rye",author:"J.D. Salinger",genre:"Coming-of-Age Fiction",year:1951,pages:214,rating:4.2,reviews:2231,description:"Sixteen-year-old Holden Caulfield wanders New York City after being expelled from prep school, railing against the phoniness of the adult world in one of literature's most iconic adolescent voices.\n\nSalinger captured adolescent alienation so perfectly that the book became a defining cultural touchstone.",quote:"What really knocks me out is a book that, when you're all done reading it, you wish the author that wrote it was a terrific friend.",tags:["Coming-of-Age","Alienation","New York"],c:["#cc0000","#ff0000"],chapters:["Expelled","New York","Phoebe","Home"]},

let S={
  view:'home',
  detailId:null,
  query:'',
  filterGenre:'all',
  filterRating:0,
  sortBy:'rating',
  viewMode:'grid',
  page:1,

  myReviews:{},

  reviewInputs:{},
};

// ============================================================
// PERSISTENCE
// ============================================================
function loadState(){
  try{
    const d=localStorage.getItem('bibliotheca_v2');
    if(d){const p=JSON.parse(d);['shelf','progress','myRatings','myReviews','myNotes'].forEach(k=>{if(p[k])S[k]=p[k]});}
  }catch(e){}
}
function saveState(){
  try{localStorage.setItem('bibliotheca_v2',JSON.stringify({shelf:S.shelf,progress:S.progress,myRatings:S.myRatings,myReviews:S.myReviews,myNotes:S.myNotes}));}catch(e){}
}

// ============================================================
// HELPERS
// ============================================================
function starsHTML(r,size=10.5){
  let h='<div class="stars">';
  for(let i=1;i<=5;i++){
    h+=`<span class="star${i>r?' e':''}" style="font-size:${size}px">★</span>`;
  }
  return h+'</div>';
}
function myStarsHTML(bookId){
  const cur=S.myRatings[bookId]||0;
  let h='<div class="my-rate-stars" id="msr_'+bookId+'">';
  for(let i=1;i<=5;i++){
    h+=`<span class="my-star${i<=cur?' on':''}" data-bid="${bookId}" data-val="${i}">★</span>`;
  }
  return h+'</div>';
}
function getCoverStyle(book){
  return `background:linear-gradient(145deg,${book.c[0]} 0%,${book.c[1]} 100%)`;
}
function coverHTML(book,full=true){
  const s=getCoverStyle(book);
  const pat=getCoverPattern(book.id);
  return `<div class="cover" style="${s}">
    ${pat}
    <div class="cover-over"></div>
    ${full?`<div class="cover-txt">${esc(book.title)}</div>`:''}
  </div>`;
}
function getCoverPattern(id){
  const patterns=[
    `<svg class="cover-deco" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="pd${id}" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="white" stroke-width="1.2"/></pattern></defs><rect width="100%" height="100%" fill="url(#pd${id})"/></svg>`,
    `<svg class="cover-deco" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="pd${id}" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1.8" fill="white"/></pattern></defs><rect width="100%" height="100%" fill="url(#pd${id})"/></svg>`,
    `<svg class="cover-deco" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="pd${id}" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="none" stroke="white" stroke-width=".6"/></pattern></defs><rect width="100%" height="100%" fill="url(#pd${id})"/></svg>`,
    `<svg class="cover-deco" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="pd${id}" width="6" height="6" patternUnits="userSpaceOnUse"><line x1="0" y1="3" x2="6" y2="3" stroke="white" stroke-width=".8"/></pattern></defs><rect width="100%" height="100%" fill="url(#pd${id})"/></svg>`,
    `<svg class="cover-deco" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="pd${id}" width="12" height="12" patternUnits="userSpaceOnUse"><line x1="0" y1="0" x2="12" y2="12" stroke="white" stroke-width=".7"/><line x1="12" y1="0" x2="0" y2="12" stroke="white" stroke-width=".7"/></pattern></defs><rect width="100%" height="100%" fill="url(#pd${id})"/></svg>`,
  ];
  return patterns[id%patterns.length];
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shelfCount(){return S.shelf.want.length+S.shelf.reading.length+S.shelf.read.length}
function totalShelfBooks(){return shelfCount()}
function readPages(){return S.shelf.read.reduce((a,id)=>{const b=BOOKS.find(x=>x.id===id);return a+(b?b.pages:0)},0)}
function avgMyRating(){const rs=Object.values(S.myRatings);return rs.length?(rs.reduce((a,b)=>a+b,0)/rs.length).toFixed(1):'-'}
function toast(msg,type='info'){
  const d=document.getElementById('toasts');
  const t=document.createElement('div');
  t.className=`toast ${type}`;
  t.innerHTML=`<span>${type==='ok'?'✅':type==='err'?'❌':'📚'}</span><span>${msg}</span>`;
  d.appendChild(t);
  setTimeout(()=>{t.style.animation='tin .3s ease reverse';setTimeout(()=>t.remove(),300)},3000);
}
function nav(view){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const vEl=document.getElementById('view-'+view);
  if(vEl)vEl.classList.add('active');
  const nEl=document.querySelector(`[data-nav="${view}"]`);
  if(nEl)nEl.classList.add('active');
  S.view=view;
  closeMobileMenu();
  renderView(view);
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderView(v){
  if(v==='home')renderHome();
  else if(v==='library')renderLibrary();
  else if(v==='shelf')renderShelf();
  else if(v==='authors')renderAuthors();
  else if(v==='categories')renderCategories();
  else if(v==='stats')renderStats();
  updateBadges();
}
function updateBadges(){
  document.getElementById('nbShelf').textContent=shelfCount();
  document.getElementById('nbLib').textContent=BOOKS.length;
}
function openBook(id){
  S.detailId=id;
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const vEl=document.getElementById('view-detail');
  if(vEl)vEl.classList.add('active');
  renderDetail(id);
  window.scrollTo({top:0,behavior:'smooth'});
  closeMobileMenu();
}
function closeMobileMenu(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sbOverlay').classList.remove('open');
}

function renderHome(){
  const featured=BOOKS.filter(b=>b.featured);
  const recent=[...BOOKS].sort((a,b)=>b.year-a.year).slice(0,8);
  const el=document.getElementById('view-home');
  el.innerHTML=`
  <div class="hero">
    <div class="hero-eye">Welcome to Bibliotheca</div>
    <h1 class="hero-h">Your Personal<br>Book Universe</h1>
    <p class="hero-p">Discover, track, and celebrate great literature. A curated collection of classic and contemporary works, right at your fingertips.</p>
    <div class="hero-stats">
      <div><div class="hs-num">${BOOKS.length}</div><div class="hs-lab">Books</div></div>
      <div><div class="hs-num">${[...new Set(BOOKS.map(b=>b.author))].length}</div><div class="hs-lab">Authors</div></div>
      <div><div class="hs-num">${CATEGORIES.length}</div><div class="hs-lab">Genres</div></div>
      <div><div class="hs-num">${shelfCount()}</div><div class="hs-lab">In My Shelf</div></div>
    </div>
  </div>

  <div class="sec-hdr"><h2 class="sec-title">✨ Featured Books</h2><span class="sec-link" onclick="nav('library')">View all →</span></div>
  <div class="featured-strip">
    ${featured.map(b=>`
    <div class="feat-card" onclick="openBook(${b.id})">
      <div class="feat-cov"><div class="feat-badge">Featured</div>${coverHTML(b,false)}</div>
      <div class="feat-info">
        <div class="feat-title">${esc(b.title)}</div>
        <div class="feat-auth">${esc(b.author)}</div>
        <div style="display:flex;align-items:center;gap:5px">${starsHTML(Math.round(b.rating))}<span class="rnum">${b.rating}</span></div>
      </div>
    </div>`).join('')}
  </div>

  <div class="sec-hdr"><h2 class="sec-title">🏷 Browse by Genre</h2><span class="sec-link" onclick="nav('categories')">All categories →</span></div>
  <div class="cat-grid" style="margin-bottom:36px">
    ${CATEGORIES.slice(0,6).map(c=>{
      const cnt=BOOKS.filter(b=>c.genres.includes(b.genre)).length;
      return `<div class="cat-card" onclick="filterByCategory('${esc(c.name)}')">
        <span class="cat-icon">${c.icon}</span>
        <div class="cat-name">${esc(c.name)}</div>
        <div class="cat-cnt">${cnt} book${cnt!==1?'s':''}</div>
        <div class="cat-bg">${c.icon}</div>
      </div>`;
    }).join('')}
  </div>

  <div class="sec-hdr"><h2 class="sec-title">📖 Recently Added</h2><span class="sec-link" onclick="nav('library')">Browse library →</span></div>
  <div class="books-grid">
    ${recent.map(b=>bookCardHTML(b)).join('')}
  </div>`;
  attachCardEvents();
}

function bookCardHTML(b){
  return `<div class="book-card" onclick="openBook(${b.id})">
    <div class="bc-img">${coverHTML(b)}</div>
    <div class="bc-info">
      <div class="bc-title">${esc(b.title)}</div>
      <div class="bc-auth">${esc(b.author)}</div>
      <div style="display:flex;align-items:center">${starsHTML(Math.round(b.rating))}<span class="rnum">${b.rating}</span></div>
    </div>
  </div>`;
}

function bookListItemHTML(b){
  return `<div class="bl-item" onclick="openBook(${b.id})">
    <div class="bl-cov">${coverHTML(b,false)}</div>
    <div class="bl-info">
      <div class="bl-title">${esc(b.title)}</div>
      <div class="bl-auth">by ${esc(b.author)}</div>
      <div class="bl-desc">${esc(b.description.split('\n')[0])}</div>
      <div class="bl-meta">
        <span class="tag">${esc(b.genre)}</span>
        <span class="tag">${b.year<0?Math.abs(b.year)+' BCE':b.year}</span>
        <span class="tag">${b.pages} pages</span>
        ${starsHTML(Math.round(b.rating),11)}<span class="rnum">${b.rating}</span>
      </div>
    </div>
    <div class="bl-actions">
      <button class="btn btn-shelf ${S.shelf.want.includes(b.id)?'on':''}" onclick="event.stopPropagation();toggleShelf(${b.id},'want')" title="Want to Read">🔖 Want</button>
    </div>
  </div>`;
}

  // cards already have onclick in HTML

function renderLibrary(){

  const genres=[...new Set(BOOKS.map(b=>b.genre))].sort();
  el.innerHTML=`
  <h1 style="font-size:28px;font-weight:900;margin-bottom:22px">📚 The Library</h1>
  <div class="lib-bar">
    <div class="view-toggle">
      <button class="vbtn ${S.viewMode==='grid'?'active':''}" onclick="setViewMode('grid')" title="Grid">⊞</button>
      <button class="vbtn ${S.viewMode==='list'?'active':''}" onclick="setViewMode('list')" title="List">≡</button>
      <button class="vbtn ${S.viewMode==='table'?'active':''}" onclick="setViewMode('table')" title="Table">⊟</button>
    </div>
    <select class="f-sel" id="libGenre" onchange="S.filterGenre=this.value;S.page=1;renderBooks()">

      <option value="rating" ${S.sortBy==='rating'?'selected':''}>Sort: Top Rated</option>
      <option value="title" ${S.sortBy==='title'?'selected':''}>Sort: A–Z</option>
      <option value="year_desc" ${S.sortBy==='year_desc'?'selected':''}>Sort: Newest</option>
      <option value="year_asc" ${S.sortBy==='year_asc'?'selected':''}>Sort: Oldest</option>
      <option value="pages" ${S.sortBy==='pages'?'selected':''}>Sort: Longest</option>
    </select>
    <select class="f-sel" id="libRating" onchange="S.filterRating=+this.value;S.page=1;renderBooks()">
      <option value="0">All Ratings</option>
      <option value="4.5" ${S.filterRating===4.5?'selected':''}>4.5+ Stars</option>
      <option value="4" ${S.filterRating===4?'selected':''}>4.0+ Stars</option>
      <option value="3.5" ${S.filterRating===3.5?'selected':''}>3.5+ Stars</option>
    </select>
    <span class="res-count" id="resCount"></span>
  </div>
  <div id="booksContainer"></div>
  <div id="pagination"></div>`;
  renderBooks();
}

function getFilteredBooks(){
  let books=[...BOOKS];
  if(S.query){
    const q=S.query.toLowerCase();
    books=books.filter(b=>b.title.toLowerCase().includes(q)||b.author.toLowerCase().includes(q)||b.genre.toLowerCase().includes(q)||b.tags.some(t=>t.toLowerCase().includes(q)));
  }
  if(S.filterGenre!=='all')books=books.filter(b=>b.genre===S.filterGenre);
  if(S.filterRating>0)books=books.filter(b=>b.rating>=S.filterRating);
  if(S.sortBy==='rating')books.sort((a,b)=>b.rating-a.rating);
  else if(S.sortBy==='title')books.sort((a,b)=>a.title.localeCompare(b.title));
  else if(S.sortBy==='year_desc')books.sort((a,b)=>b.year-a.year);
  else if(S.sortBy==='year_asc')books.sort((a,b)=>a.year-b.year);
  else if(S.sortBy==='pages')books.sort((a,b)=>b.pages-a.pages);
  return books;
}

function renderBooks(){
  const books=getFilteredBooks();
  const total=books.length;
  const pages=Math.ceil(total/12);
  if(S.page>pages)S.page=1;
  const slice=books.slice((S.page-1)*12,S.page*12);
  const cEl=document.getElementById('booksContainer');
  const rcEl=document.getElementById('resCount');
  if(rcEl)rcEl.textContent=`${total} book${total!==1?'s':''}`;
  if(!cEl)return;
  if(books.length===0){
    cEl.innerHTML=`<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">No books found</div><div class="empty-sub">Try adjusting your filters or search query.</div></div>`;
    document.getElementById('pagination').innerHTML='';
    return;
  }
  if(S.viewMode==='grid'){
    cEl.innerHTML=`<div class="books-grid">${slice.map(b=>bookCardHTML(b)).join('')}</div>`;
  } else if(S.viewMode==='list'){
    cEl.innerHTML=`<div class="books-list">${slice.map(b=>bookListItemHTML(b)).join('')}</div>`;
  } else {
    cEl.innerHTML=`<div class="tbl-wrap">
      <table class="bk-table">
        <thead><tr>
          <th onclick="S.sortBy='title';renderBooks()">Title</th>
          <th onclick="S.sortBy='title';renderBooks()">Author</th>
          <th>Genre</th>
          <th onclick="S.sortBy='year_desc';renderBooks()">Year</th>
          <th onclick="S.sortBy='pages';renderBooks()">Pages</th>
          <th onclick="S.sortBy='rating';renderBooks()">Rating</th>
          <th></th>
        </tr></thead>
        <tbody>${slice.map(b=>`<tr onclick="openBook(${b.id})">
          <td><span style="display:inline-flex;align-items:center"><span class="tbl-mini">${coverHTML(b,false)}</span><span class="tbl-title">${esc(b.title)}</span></span></td>
          <td>${esc(b.author)}</td>
          <td><span class="tag">${esc(b.genre)}</span></td>
          <td>${b.year<0?Math.abs(b.year)+' BCE':b.year}</td>
          <td>${b.pages}</td>
          <td style="display:flex;align-items:center;gap:5px">${starsHTML(Math.round(b.rating))} <span class="rnum">${b.rating}</span></td>
          <td><button class="btn btn-shelf ${S.shelf.want.includes(b.id)?'on':''}" onclick="event.stopPropagation();toggleShelf(${b.id},'want')">🔖</button></td>
        </tr>`).join('')}</tbody>
      </table></div>`;
  }
  // pagination
  if(pages>1){
    let ph='<div class="pag">';
    ph+=`<button class="pg-btn" onclick="S.page=${S.page-1};renderBooks()" ${S.page===1?'disabled':''}>‹</button>`;
    for(let i=1;i<=pages;i++){
      if(i===1||i===pages||Math.abs(i-S.page)<=1){
        ph+=`<button class="pg-btn ${i===S.page?'active':''}" onclick="S.page=${i};renderBooks()">${i}</button>`;
      } else if(Math.abs(i-S.page)===2){
        ph+=`<button class="pg-btn" disabled>…</button>`;
      }
    }
    ph+=`<button class="pg-btn" onclick="S.page=${S.page+1};renderBooks()" ${S.page===pages?'disabled':''}>›</button>`;
    ph+='</div>';
    document.getElementById('pagination').innerHTML=ph;
  } else {
    document.getElementById('pagination').innerHTML='';
  }
}

function setViewMode(m){
  S.viewMode=m;
  document.querySelectorAll('.vbtn').forEach((b,i)=>{b.classList.toggle('active',['grid','list','table'][i]===m)});
  renderBooks();
}

function updateProgress(id){
  const inp=document.getElementById('progIn_'+id);
  if(!inp)return;
  const b=BOOKS.find(x=>x.id===id);
  const val=Math.min(b.pages,Math.max(0,+inp.value||0));
  S.progress[id]={current:val,total:b.pages};
  saveState();
  const pct=Math.round((val/b.pages)*100);
  const bar=document.getElementById('progBar_'+id);
  if(bar)bar.style.width=pct+'%';
  toast(`Progress updated: ${pct}%`,'ok');
  if(val>=b.pages&&!S.shelf.read.includes(id)){
    toggleShelf(id,'read');
    toast('Marked as Read automatically!','ok');
  }
}

function saveNotes(id){
  const inp=document.getElementById('notesIn_'+id);
  if(!inp)return;
  S.myNotes[id]=inp.value;
  saveState();
  toast('Notes saved!','ok');
}

function submitReview(id){
  const ta=document.getElementById('revInput_'+id);
  if(!ta||!ta.value.trim()){toast('Please write a review first.','err');return;}
  S.myReviews[id]=ta.value.trim();
  saveState();
  toast('Review posted!','ok');
  renderDetail(id);
}

    {icon:'📚',name:'Bookworm',desc:'Read 5 books',earned:booksRead>=5},
    {icon:'🏆',name:'Scholar',desc:'Read 10 books',earned:booksRead>=10},
    {icon:'✍️',name:'Critic',desc:'Write 3 reviews',earned:Object.keys(S.myReviews).length>=3},
    {icon:'⭐',name:'Rater',desc:'Rate 5 books',earned:Object.keys(S.myRatings).length>=5},
    {icon:'🔖',name:'Collector',desc:'Add 10 books to shelf',earned:shelfCount()>=10},
    {icon:'📝',name:'Note-Taker',desc:'Write 2 notes',earned:Object.keys(S.myNotes).length>=2},
    {icon:'🌟',name:'Bibliophile',desc:'Read 1000+ pages',earned:pagesRead>=1000},
  ];
  el.innerHTML=`
  <h1 style="font-size:28px;font-weight:900;margin-bottom:22px">📊 My Statistics</h1>
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-lab">Books Read</div><div class="stat-val">${booksRead}</div><div class="stat-sub">of ${BOOKS.length} total</div></div>
    <div class="stat-card"><div class="stat-lab">Pages Read</div><div class="stat-val">${pagesRead.toLocaleString()}</div><div class="stat-sub">estimated total</div></div>
    <div class="stat-card"><div class="stat-lab">My Avg Rating</div><div class="stat-val">${avgR}</div><div class="stat-sub">${Object.keys(S.myRatings).length} books rated</div></div>
    <div class="stat-card"><div class="stat-lab">Shelf Size</div><div class="stat-val">${shelfCount()}</div><div class="stat-sub">${S.shelf.reading.length} reading now</div></div>
    <div class="stat-card"><div class="stat-lab">Reviews Written</div><div class="stat-val">${Object.keys(S.myReviews).length}</div><div class="stat-sub">community reviews</div></div>
    <div class="stat-card"><div class="stat-lab">Notes Saved</div><div class="stat-val">${Object.keys(S.myNotes).length}</div><div class="stat-sub">personal annotations</div></div>
  </div>
  <div class="chart-card">
    <div class="ch-title">Library Genre Distribution</div>
    ${topGenres.map(([g,n])=>`<div class="bar-row">
      <div class="bar-lab">${esc(g)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(n/maxG*100).toFixed(0)}%"></div></div>
      <div class="bar-cnt">${n}</div>
    </div>`).join('')}
  </div>
  ${S.shelf.read.length?`<div class="chart-card">
    <div class="ch-title">Books Read by Genre</div>
    ${(()=>{
      const rg={};
      S.shelf.read.forEach(id=>{const b=BOOKS.find(x=>x.id===id);if(b)rg[b.genre]=(rg[b.genre]||0)+1;});
      const entries=Object.entries(rg).sort((a,b)=>b[1]-a[1]);
      const mx=entries[0]?.[1]||1;
      return entries.map(([g,n])=>`<div class="bar-row">
        <div class="bar-lab">${esc(g)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(n/mx*100).toFixed(0)}%"></div></div>
        <div class="bar-cnt">${n}</div>
      </div>`).join('');
    })()}
  </div>`:''}
  <h2 style="font-size:22px;font-weight:700;margin:28px 0 6px">🏆 Achievements</h2>
  <p style="font-family:'DM Sans',sans-serif;font-size:13px;color:var(--text3);margin-bottom:16px">${achievements.filter(a=>a.earned).length} / ${achievements.length} earned</p>
  <div class="ach-grid">
    ${achievements.map(a=>`<div class="ach-card ${a.earned?'earned':''}">
      <div class="ach-icon">${a.icon}</div>
      <div class="ach-name">${a.name}</div>
      <div class="ach-desc">${a.desc}</div>
    </div>`).join('')}
  </div>`;
}

// ============================================================
// SHELF MANAGEMENT
// ============================================================
function toggleShelf(id,shelf){
  // Remove from all shelves first if already in another
  const alreadyIn=S.shelf[shelf].includes(id);
  if(alreadyIn){
    S.shelf[shelf]=S.shelf[shelf].filter(x=>x!==id);
    toast('Removed from shelf','info');
  } else {
    // If marking as read, remove from want/reading
    if(shelf==='read'){S.shelf.want=S.shelf.want.filter(x=>x!==id);S.shelf.reading=S.shelf.reading.filter(x=>x!==id);}
    if(shelf==='reading'){S.shelf.want=S.shelf.want.filter(x=>x!==id);S.shelf.read=S.shelf.read.filter(x=>x!==id);}
    if(shelf==='want'){S.shelf.reading=S.shelf.reading.filter(x=>x!==id);S.shelf.read=S.shelf.read.filter(x=>x!==id);}
    S.shelf[shelf].push(id);
    const labels={want:'Want to Read',reading:'Currently Reading',read:'Read ✅'};
    toast(`Added to ${labels[shelf]}`,'ok');
  }
  saveState();updateBadges();
  // refresh detail buttons if in detail view
  if(S.detailId===id){
    ['want','reading','read'].forEach(k=>{
      const btn=document.getElementById('btn_'+k);
      if(btn){
        const on=S.shelf[k].includes(id);
        btn.classList.toggle('on',on);
        const labels2={want:['🔖 Want to Read','🔖 In Want List'],reading:['📗 Start Reading','📗 Currently Reading'],read:['✅ Mark as Read','✅ Read ✓']};
        btn.textContent=on?labels2[k][1]:labels2[k][0];
      }
    });
  }
}

// ============================================================
// SEARCH
// ============================================================
function initSearch(){
  const inp=document.getElementById('gSearch');
  const drop=document.getElementById('sDropdown');
  const clr=document.getElementById('sClear');
  inp.addEventListener('input',function(){
    const q=this.value.trim();
    S.query=q;
    if(q.length>=1){
      const res=BOOKS.filter(b=>b.title.toLowerCase().includes(q.toLowerCase())||b.author.toLowerCase().includes(q.toLowerCase())).slice(0,8);
      if(res.length){
        drop.innerHTML=res.map(b=>`<div class="sr-item" onclick="openBook(${b.id});document.getElementById('gSearch').value='';drop.classList.remove('open')">
          <div class="sr-cov">${coverHTML(b,false)}</div>
          <div class="sr-info">
            <div class="sr-title">${esc(b.title)}</div>
            <div class="sr-auth">${esc(b.author)} · ${esc(b.genre)}</div>
          </div>
        </div>`).join('');
      } else {
        drop.innerHTML=`<div class="sr-none">No books found for "${esc(q)}"</div>`;
      }
      drop.classList.add('open');
    } else {
      drop.classList.remove('open');
    }
    if(S.view==='library')renderBooks();
  });
  inp.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&this.value.trim()){drop.classList.remove('open');nav('library');}
    if(e.key==='Escape'){this.value='';S.query='';drop.classList.remove('open');}
  });
  clr.addEventListener('click',function(){
    inp.value='';S.query='';drop.classList.remove('open');
    if(S.view==='library')renderBooks();
  });
  document.addEventListener('click',function(e){
    if(!e.target.closest('.search-wrap'))drop.classList.remove('open');
  });
  // keyboard shortcut: / to focus search
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){
      e.preventDefault();inp.focus();
    }
  });
}

// ============================================================
// THEME
// ============================================================
function initTheme(){
  const stored=localStorage.getItem('bib_theme')||'dark';
  document.documentElement.setAttribute('data-theme',stored);
  updateThemeBtn(stored);
  document.getElementById('themeBtn').addEventListener('click',function(){
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('bib_theme',next);
    updateThemeBtn(next);
  });
}
function updateThemeBtn(theme){
  document.getElementById('themeIco').textContent=theme==='dark'?'☀️':'🌙';
  document.getElementById('themeLabel').textContent=theme==='dark'?'Light Mode':'Dark Mode';
}

// ============================================================
// MOBILE MENU
// ============================================================
function initMobile(){
  document.getElementById('mobMenu').addEventListener('click',function(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sbOverlay').classList.toggle('open');
  });
  document.getElementById('sbOverlay').addEventListener('click',closeMobileMenu);
}

// ============================================================
// INIT
// ============================================================
function init(){
  loadState();
  initTheme();
  initSearch();
  initMobile();
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.addEventListener('click',function(){nav(this.dataset.nav);});
  });
  updateBadges();
  renderHome();
}
document.addEventListener('DOMContentLoaded',init);
</script>
